<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one-column phone app, comic panels with thick ink outlines and hard offset shadows, bottom tab bar */
:root{
  --ink:#0d0f12;
  --ground:#0d0f12;
  --dots:transparent;
  --paper:#16191e;
  --card2:#1f2329;
  --line:#2a3038;
  --text:#eef1f4;
  --muted:#8b949e;
  --acc:#c6f135;
  --acc-soft:rgba(198,241,53,.12);
  --acc-line:rgba(198,241,53,.45);
  --bad:#ef6b5d;
  --yellow:var(--acc);
  --orange:var(--acc);
  --pink:var(--acc);
  --teal:var(--acc);
  --violet:var(--acc);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ground);
  background-image:radial-gradient(var(--dots) 2px,transparent 2.4px);
  background-size:14px 14px;
  color:var(--text);font-family:var(--f-body);font-size:15px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;letter-spacing:.04em;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:.9;color:var(--yellow);
  -webkit-text-stroke:0;paint-order:stroke fill;text-shadow:none;transform:rotate(-3deg)}
.logo small{display:block;font-size:17px;color:var(--teal)}
.hello{font-family:var(--f-label);font-weight:800;color:var(--text);text-align:right;line-height:1.1;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.hello b{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;font-size:22px;color:var(--pink);letter-spacing:.05em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:14px;margin-bottom:16px;position:relative}
.panel.tilt{transform:rotate(-.6deg)}
.burst{background:var(--yellow)}
.panel h2{font-size:26px;margin-bottom:8px}
.tag{display:inline-block;font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:var(--teal)}
.tag.o{background:var(--orange)}.tag.p{background:var(--pink);color:#fff}.tag.v{background:var(--violet);color:#fff}.tag.y{background:var(--yellow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:5px;padding:8px 6px;text-align:center;background:var(--card2)}
.stat .n{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--f-label);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.k{background:var(--orange)}.stat.k .l{color:var(--text)}
.ex{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.ex:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-h h3{font-size:21px}
.ex-h span{font-family:var(--f-label);font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;margin-top:6px;align-items:center}
.sets .hd{font-family:var(--f-label);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sets .num{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:18px;text-align:center}
input,select{font:600 15px var(--f-body);color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:7px 8px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.chk{width:44px;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--card2);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:22px;cursor:pointer;color:var(--text)}
.chk.on{background:var(--teal)}
.btn{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.06em;border:1px solid var(--line);border-radius:5px;box-shadow:none;background:var(--pink);color:#fff;padding:10px 16px;cursor:pointer;width:100%;
  text-shadow:none}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.y{background:var(--yellow);color:var(--text);text-shadow:none}
.btn.small{font-size:17px;padding:6px 12px;width:auto;box-shadow:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:5px;background:var(--card2);padding:8px 0;text-align:center;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:16px;cursor:pointer;color:var(--text)}
.day.on{background:var(--yellow);box-shadow:none}
.plan{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pday{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--card2)}
.pday.rest{background:transparent;border-style:dashed;color:var(--muted)}
.pday .d{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px}
.pday .s{font-weight:800;line-height:1.15}
.pday .s small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.pday .k{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:18px;color:var(--orange);-webkit-text-stroke:0;white-space:nowrap}
.pday.today{background:var(--teal)}
.phase{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:10px 0 4px}
.phase i{height:16px;border:1px solid var(--line);border-radius:2px;background:var(--card2)}
.phase i.done{background:var(--violet)}
.phase i.cur{background:var(--pink)}
.phase-l{display:flex;justify-content:space-between;font-family:var(--f-label);font-weight:800;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.note{font-size:13px;color:var(--muted);line-height:1.4;margin:8px 0 0}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0}
.field label{font-family:var(--f-label);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{border:1px solid var(--line);border-radius:5px;background:var(--card2);padding:10px 8px;cursor:pointer;text-align:left;font:800 15px var(--f-body);color:var(--text)}
.goal small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.goal.on{background:var(--orange);box-shadow:none}
.goal.on small{color:var(--text)}
.mus{font-family:var(--f-label);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card2)}
.mus:first-child{background:var(--teal)}
.ml{margin:2px 0 0;font-size:13px;line-height:1.35}
.ml span{color:var(--muted)}
.ml i{font-style:normal;font-family:var(--f-label);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--violet)}
.exl{margin:10px 0 0;padding:0;list-style:none;counter-reset:e;display:flex;flex-direction:column;gap:8px}
.exl li{border-top:1px dashed var(--line);padding-top:8px}
.exl li:first-child{border-top:0;padding-top:0}
.lbl{font-family:var(--f-label);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2 .ic{vertical-align:-3px}
.tag .ic{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.mus{display:inline-flex;align-items:center;gap:4px}.mus .ic{width:16px;height:16px}
.stat .ic{display:block;width:22px;height:22px;margin:0 auto 4px}
.goal .ic{display:block;width:28px;height:28px;margin-bottom:4px}
.ib{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;box-shadow:none}
.ib .ic{width:21px;height:21px;color:var(--text)}
.ex-h{align-items:center}.ex-h h3{flex:1;min-width:0}
.pi{display:flex;gap:3px;margin-bottom:2px}.pi .ic{width:16px;height:16px}
.who{display:flex;align-items:center;gap:10px}
.av{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--teal);box-shadow:none;
  overflow:hidden;display:grid;place-items:center;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:22px;color:var(--text);outline:3px solid var(--yellow);outline-offset:-6px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:104px;height:104px;font-size:44px;cursor:default;transform:rotate(-3deg);outline-offset:-9px;outline-width:4px}
.photo{display:flex;gap:16px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.photo-a{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1;min-width:0}
label.btn{display:inline-block;text-align:center}
.prog{display:flex;gap:8px;align-items:flex-start;margin:8px 0 6px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--card2);font-size:13px;line-height:1.35}
.prog .ic{width:18px;height:18px;margin-top:1px}
.prog.up{background:var(--teal)}.prog.down{background:var(--card2)}.prog.deload{background:var(--card2)}.prog.new{background:var(--yellow)}
.load{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin:6px 0 8px}
.stp{height:48px;border:1px solid var(--line);border-radius:5px;background:var(--yellow);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1;cursor:pointer;color:var(--text);box-shadow:none}
.stp:active{transform:translate(2px,2px);box-shadow:none}
.kg{display:flex;align-items:baseline;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:5px;background:var(--card2);height:48px;padding:0 8px}
.kg input{border:0;padding:0;text-align:right;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:30px;width:100%;max-width:110px;background:transparent;height:44px}
.kg span{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px}
.setrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bub{width:58px;height:58px;border:1px solid var(--line);border-radius:50%;background:var(--card2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--text);padding:0}
.bub b{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;font-size:22px}
.bub small{font-family:var(--f-label);font-weight:800;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bub.on{background:var(--teal);box-shadow:none}.bub.on small{color:var(--text)}
.bub.less{background:var(--orange)}
.all{margin-left:auto;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:17px;border:1px solid var(--line);border-radius:5px;background:var(--pink);color:#fff;padding:8px 10px;cursor:pointer;text-shadow:none}
.pl{display:flex;flex-direction:column;gap:10px}
.pr{display:grid;grid-template-columns:36px 1fr 70px auto;gap:8px;align-items:center}
.pn{min-width:0}.pn b{display:block;font-weight:800;line-height:1.15}.pn small{color:var(--muted);font-size:12px}
.spark{width:70px;height:30px}
.pv{text-align:right}.pv b{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;font-size:20px;white-space:nowrap}
.pv small{font-family:var(--f-label);font-weight:800;font-size:12px}.pv .up{color:var(--acc)}.pv .dn{color:var(--bad)}
.mine{font-style:normal;font-family:var(--f-label);font-weight:800;font-size:10px;text-transform:uppercase;background:var(--violet);color:#fff;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}
.elist{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:36px 1fr auto;grid-template-areas:"b n o" "b s s";gap:6px 10px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.erow:first-child{border-top:0;padding-top:0}
.erow .ib{grid-area:b;align-self:start}.erow .en{grid-area:n;min-width:0}.erow .es{grid-area:s}.erow .eo{grid-area:o;display:flex;gap:4px}
.en b{display:block;font-weight:800;line-height:1.15}.en small{color:var(--muted);font-size:12px}
.es{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:800}
.es b{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;font-size:24px;min-width:18px;text-align:center}
.es small{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.mini{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--yellow);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px;cursor:pointer;color:var(--text);line-height:1;padding:0}
.mini.x{background:var(--pink);color:#fff}.mini:disabled{opacity:.35;cursor:default}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gchips .mus{cursor:pointer;color:var(--text)}.gchips .mus:first-child{background:var(--card2)}.gchips .mus.on{background:var(--yellow)}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:block;text-align:left;border:1px solid var(--line);border-radius:5px;background:var(--card2);padding:8px 10px 8px 40px;position:relative;cursor:pointer;font:800 15px var(--f-body);color:var(--text)}
.pick span{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--teal);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:16px}
.pick small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.pick.has{opacity:.55;cursor:default}
#tour{position:fixed;inset:0;z-index:30}
#tour[hidden]{display:none!important}
.tour-w{background:rgba(4,5,7,.82);display:grid;place-items:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wcard{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:none;padding:18px;width:100%;max-width:420px}
.wcard .goal{padding:8px;font-size:14px}
.linkb{display:block;margin:12px auto 0;background:none;border:0;font:800 14px var(--f-label);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-decoration:underline}
.spot{position:fixed;border:4px solid var(--yellow);border-radius:8px;box-shadow:0 0 0 9999px rgba(4,5,7,.78);transition:all .25s ease;pointer-events:none}
.spot.none{top:50%;left:50%;width:0;height:0;border:0}
.bubble{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:428px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:14px}
.bubble.b-bot{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bubble.b-top{top:calc(16px + env(safe-area-inset-top,0px))}
.bubble h3{font-size:26px;margin:8px 0 4px}
.bubble p{margin:0 0 12px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.spot{transition:none}}
.ml i.em{color:#fff;background:var(--pink);padding:0 4px;border-radius:3px}
.gchips .mus{cursor:pointer;color:var(--text);background:var(--card2)}.gchips .mus.on{background:var(--yellow)}
#rest[hidden],#sheet[hidden],#celebrate[hidden]{display:none!important}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;align-items:center}
.tl{display:inline-flex;align-items:center;gap:4px;font:800 12px var(--f-label);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;background:var(--card2);padding:4px 10px;cursor:pointer;color:var(--text)}
.tl .ic{width:14px;height:14px}
.streak{margin:10px 0 0;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.streak .ic{width:20px;height:20px;color:var(--pink)}
.wu{display:flex;flex-direction:column;gap:4px;margin:0 0 8px}
.wuc{display:flex;gap:6px;flex-wrap:wrap}
.wub{font:800 13px var(--f-label);border:1px dashed var(--line);border-radius:5px;background:transparent;padding:5px 8px;cursor:pointer;color:var(--text)}
.wub.on{background:var(--teal);border-style:solid;text-decoration:line-through}
#rest{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.rin{position:relative;overflow:hidden;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:6px 8px}
.rbar{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);z-index:0;transition:width .25s linear}
.rin>*:not(.rbar){position:relative;z-index:1}
.rl{font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;flex:1;min-width:0}
.rt{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;margin-right:4px}
.rin button{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:16px;border:1px solid var(--line);border-radius:4px;background:var(--card2);padding:4px 7px;cursor:pointer;color:var(--text)}
.rin.go{animation:pow .35s ease-out}.rin.go .rbar{background:var(--teal)}
#sheet{position:fixed;inset:0;z-index:25}
.sh-bg{position:absolute;inset:0;background:rgba(4,5,7,.7)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;max-width:520px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh h2{font-size:28px;padding-right:44px}

<script>

  desenv:{n:'Desenvolvimento',met:5,m:'Ombros',s:['Tríceps','Core'],t:'base'},

/* ---------- Motor de treino ---------- */
function weekIndex(){const s=new Date(S.profile.inicio+'T00:00:00');return Math.max(0,Math.floor((today-s)/(7*864e5)))}
function phaseOf(w){return PHASES[w%4]}
function sessionFor(code,goal,enf){
  const g=GOALS[goal||S.profile.objetivo],ph=phaseOf(weekIndex());
  const sets=Math.max(2,g.base+ph.add);
  if(SES[code].custom){
    /* treino personalizado: respeita exercícios e séries escolhidos; na semana leve tira 1 série */
    return SES[code].items.filter(it=>EX[it.k]).map(it=>{const e=EX[it.k];
      return{k:it.k,n:e.n,met:e.met,m:e.m,s:e.s||[],t:e.t,bw:e.bw,iso:e.iso,cardio:e.cardio,sets:e.cardio?1:Math.max(1,it.sets+(ph.add<0?-1:0)),reps:e.cardio?e.cardio+' min':(e.iso?'30–45 s':g.reps)}});
  }
  let list=SES[code].ex.slice();
  if(code!=='MB'){
    /* força fica com os multiarticulares; os outros objetivos completam com isolados até o limite */
    const base=list.filter(k=>EX[k].t==='base'),iso=list.filter(k=>EX[k].t!=='base');
    const pick=base.concat(iso).slice(0,g.max);
    list=list.filter(k=>pick.includes(k));
    /* ênfase: grupo escolhido vai para o início, ganha 1 exercício extra e +1 série */
    const E=EMPH[enf||S.profile.enfase||'eq'],isE=k=>E.mus.includes(mi(EX[k].m));
    if(E.mus.length&&(E.always||list.some(isE))){
      const add=E.extra.find(k=>!list.includes(k));if(add)list.push(add);
      list=list.filter(isE).concat(list.filter(k=>!isE(k)));
    }
    if(g.extra)list.push(g.extra);
    var emph=isE;
  }
  return list.map(k=>{const e=EX[k],em=!e.cardio&&emph&&emph(k);return{k,n:e.n,met:e.met,m:e.m,s:e.s,t:e.t,bw:e.bw,iso:e.iso,cardio:e.cardio,emph:em,sets:e.cardio?1:sets+(em?1:0),reps:e.cardio?e.cardio+' min':(e.iso?'30–45 s':g.reps)}});
}
function kcalFor(exs,goal){const keep=S.profile.objetivo;if(goal)S.profile.objetivo=goal;const r=kcalOf(exs);S.profile.objetivo=keep;return r}
function weekPlan(){
  /* dias com treino personalizado ficam fixos; a sugestão automática divide os dias restantes */
  const days=S.profile.dias,A=S.profile.assign||{},idx=[];days.forEach((on,i)=>on&&!(A[i]&&SES[A[i]])&&idx.push(i));
  const split=splitFor(idx.length);const map={};
  idx.forEach((d,i)=>map[d]=split[i]);
  Object.entries(S.profile.assign||{}).forEach(([d,c])=>{if(days[d]&&SES[c])map[d]=c});
  return map;
}
/* kcal = MET × peso(kg) × horas; ajuste leve pela idade (gasto basal cai ~0,3% por ano após os 30) */
function kcalOf(exs){
  const g=GOALS[S.profile.objetivo];let min=0,kc=0;
  exs.forEach(e=>{const m=e.cardio?e.cardio:e.sets*(0.75+g.rest/60);min+=m;kc+=e.met*S.profile.peso*m/60});
  const adj=1-Math.max(0,S.profile.idade-30)*0.003;
  return{kcal:Math.round(kc*adj),min:Math.round(min)};
}

/* ---------- Progressão de carga (dupla progressão) ----------
   1) Com a mesma carga, a meta de reps sobe 1 por treino até o topo da faixa.
   2) Fez todas as séries no topo da faixa? A carga sobe e a meta volta para o início da faixa.
   3) Ficou abaixo do início da faixa duas vezes seguidas? A carga desce um degrau.
   Semana de recuperação: 85% da carga. */
const r05=x=>Math.round(x*2)/2;
const fkg=x=>x.toLocaleString('pt-BR',{maximumFractionDigits:1});
function stepOf(k){const e=EX[k];if(e.t!=='base')return 2;return /Quadr|Posterior|Glút/.test(e.m)?5:2.5}
function range(goal){const g=GOALS[goal||S.profile.objetivo];const [lo,hi]=g.reps.split('–').map(Number);return{lo,hi}}
function suggest(k){
  const {lo,hi}=range(),H=(S.hist[k]||[]).filter(x=>x.date<iso(today)&&!x.ex),last=H[H.length-1],ph=phaseOf(weekIndex());
  if(EX[k].bw)return{kg:null,target:hi,msg:'Peso do corpo. Tente chegar ao topo da faixa.',kind:'keep'};
  if(!last)return{kg:null,target:lo,msg:'Primeira vez: escolha uma carga em que as últimas reps fiquem difíceis.',kind:'new'};
  const mn=Math.min(...last.reps),allTop=last.reps.length&&last.reps.every(r=>r>=hi),step=stepOf(k);
  let kg=last.kg,target,msg,kind;
  if(ph.n==='Recuperação'){return{kg:r05(last.kg*0.85),target:lo,last,msg:'Semana leve: 85% da carga para recuperar.',kind:'deload'}}
  if(allTop){kg=last.kg+step;target=lo;msg=`Você fez tudo no topo da faixa. Carga sobe ${fkg(step)} kg!`;kind='up'}
  else if(mn<lo){const prev=H[H.length-2];
    if(prev&&prev.kg===last.kg&&Math.min(...prev.reps)<lo){kg=Math.max(step,last.kg-step);target=lo;msg='Duas vezes abaixo da faixa: carga desce um pouco.';kind='down'}
    else{target=lo;msg='Mantenha a carga e busque o início da faixa.';kind='keep'}}
  else{target=Math.min(hi,mn+1);msg=`Mesma carga, meta de ${target} reps por série.`;kind='keep'}
  return{kg,target,last,msg,kind};
}
function exDraft(e){
  const d=S.d2[iso(today)]=S.d2[iso(today)]||{};
  /* enquanto nenhuma série foi marcada, a sugestão acompanha mudanças de objetivo ou de fase */
  if(!d[e.k]||(!d[e.k].touched&&d[e.k].reps.every(r=>r===null))){const sg=suggest(e.k);d[e.k]={kg:sg.kg,reps:Array(e.sets).fill(null),target:sg.target}}
  const x=d[e.k];while(x.reps.length<e.sets)x.reps.push(null);x.reps.length=e.sets;return x;
}

function sparkSvg(vals){if(vals.length<2)return'';const W=120,H=36,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;

  return `<svg class="hsp" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#c6f135" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="#c6f135"/></svg>`}

function openEditor(code,goal){
  const plan=weekPlan();delArm=false;
  if(code&&SES[code]&&SES[code].custom){const c=SES[code];ED={code,n:c.n,items:c.items.map(x=>({...x})),days:[0,1,2,3,4,5,6].filter(d=>plan[d]===code)}}
  else if(code&&SES[code]){const exs=sessionFor(code,goal),ph=phaseOf(weekIndex());
    ED={code:null,n:SES[code].n+' (meu)',items:exs.map(e=>({k:e.k,sets:e.cardio?1:e.sets-ph.add})),days:[0,1,2,3,4,5,6].filter(d=>plan[d]===code)}}
  else ED={code:null,n:'',items:[],days:[]};
  go('editor');
}

function saveEditor(){
  const n=($('#eName').value||'').trim()||'Meu treino';
  if(!ED.items.length){toast('Adicione um exercício');return}
  const code=ED.code||('C'+Date.now().toString(36));
  const groups=[...new Set(ED.items.map(x=>EX[x.k]&&EX[x.k].m).filter(Boolean))].slice(0,4);
  S.custom[code]={n,custom:true,items:ED.items,g:groups,why:'Treino montado por você.'};
  Object.keys(S.profile.assign).forEach(d=>{if(S.profile.assign[d]===code&&!ED.days.includes(+d))delete S.profile.assign[d]});
  ED.days.forEach(d=>{S.profile.assign[d]=code;S.profile.dias[d]=true});
  syncCustom();save();ED=null;toast('Treino salvo!');go('treinos');
}
function weeks(){
  const out=[];const mon=addDays(today,-((today.getDay()+6)%7));
  for(let i=5;i>=0;i--){const s=addDays(mon,-7*i),e=addDays(s,7);
    const L=S.logs.filter(l=>l.date>=iso(s)&&l.date<iso(e)),LT=L.filter(isTreino);
    const P=S.peso.filter(p=>p.date>=iso(s)&&p.date<iso(e));
    out.push({lbl:s.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),kcal:L.reduce((a,l)=>a+l.kcal,0),vol:L.reduce((a,l)=>a+(l.vol||0),0),n:L.filter(isTreino).length,kg:P.length?P[P.length-1].kg:null});
  }
  return out;
}
function bars(data,key,color,fmt){
  const W=320,H=150,pl=8,pb=22,pt=22,max=Math.max(1,...data.map(d=>d[key]))*1.1;
  const bw=(W-pl*2)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0.5,1].forEach(f=>{const y=H-pb-(H-pb-pt)*f;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="4 4"/>`});
  data.forEach((d,i)=>{const h=(H-pb-pt)*d[key]/max,x=pl+i*bw+6,y=H-pb-h,last=i===data.length-1;
    s+=`<rect x="${x}" y="${y}" width="${bw-12}" height="${h}" fill="${last?'#c6f135':'#343b44'}" rx="4"/>`;
    if(d[key])s+=`<text x="${x+(bw-12)/2}" y="${y-5}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow" font-weight="700" font-size="14" fill="#eef1f4">${fmt(d[key])}</text>`;
    s+=`<text x="${x+(bw-12)/2}" y="${H-6}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow" font-weight="800" font-size="11" fill="#8b949e">${d.lbl}</text>`});
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="#2a3038" stroke-width="1.5"/></svg>`;return s;
}
function line(data){
  const pts=data.filter(d=>d.kg!==null);if(pts.length<2)return'<p class="note">Registre seu peso no Perfil para ver a curva.</p>';
  const W=320,H=140,p=26,mn=Math.min(...pts.map(d=>d.kg))-.5,mx=Math.max(...pts.map(d=>d.kg))+.5;
  const X=i=>p+i*(W-p*2)/(data.length-1),Y=v=>H-p-(H-p*1.6)*(v-mn)/(mx-mn);
  const c=data.map((d,i)=>d.kg===null?null:[X(i),Y(d.kg),d]).filter(Boolean);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><path d="M${c.map(q=>q[0]+' '+q[1]).join(' L')} L${c[c.length-1][0]} ${H-p} L${c[0][0]} ${H-p}Z" fill="#c6f135" fill-opacity=".12"/>
    <polyline points="${c.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="#c6f135" stroke-width="2.5" stroke-linejoin="round"/>`;
  c.forEach((q,i)=>{const last=i===c.length-1;s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${last?7:5}" fill="${last?'#c6f135':'#16191e'}" stroke="#c6f135" stroke-width="2"/>
    <text x="${q[0]}" y="${q[1]-11}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow" font-weight="700" font-size="14" fill="#eef1f4">${q[2].kg.toLocaleString('pt-BR')}</text>`});
  data.forEach((d,i)=>s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow" font-weight="800" font-size="11" fill="#8b949e">${d.lbl}</text>`);
  return s+'</svg>';
}
function vEvolucao(){
  const W=weeks(),cur=W[W.length-1],prev=W[W.length-2];
  const hasEx=S.logs.some(l=>l.ex)||S.peso.some(p=>p.ex)||Object.values(S.hist).some(a=>a.some(h=>h.ex));
  const sample=hasEx?'<span class="tag y sample">Inclui dados de exemplo</span>':'';
  const diff=(a,b)=>b?Math.round((a-b)/b*100):0;
  const k=n=>n>=1000?(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':n;
  let h=`<button class="btn y" data-go="historico" style="margin-bottom:16px">${ic('cal')} Ver histórico de treinos</button>`+recoveryPanel()+`<section class="panel chart">${sample}<div class="cap"><h2>${ic('flame')} Calorias por semana</h2><b>${cur.kcal}</b></div>
    ${bars(W,'kcal','#ff7a1a',v=>v)}<p class="note">${diff(cur.kcal,prev.kcal)>=0?'+':''}${diff(cur.kcal,prev.kcal)}% em relação à semana passada.</p></section>
    <section class="panel chart"><div class="cap"><h2>${ic('dumbbell')} Volume treinado</h2><b>${k(cur.vol)} kg</b></div>
    ${bars(W,'vol','#7b4dff',k)}<p class="note">Volume = séries × repetições × carga. Subir aos poucos é sinal de progresso.</p></section>
    <section class="panel chart"><div class="cap"><h2>${ic('scale')} Peso corporal</h2><b>${S.profile.peso.toLocaleString("pt-BR")} kg</b></div>${line(W)}</section>
    <section class="panel chart"><div class="cap"><h2>${ic('trophy')} Treinos feitos</h2><b>${cur.n}</b></div>${bars(W,'n','#19c6b4',v=>v)}</section>`;
  const ks=Object.keys(S.hist).filter(k=>S.hist[k].some(x=>x.kg>0)&&EX[k]);
  if(ks.length){
    h+=`<section class="panel">${hasEx?'<span class="tag y sample">Exemplo</span>':''}<h2>${ic('trophy')} Progressão de carga</h2><div class="pl">`;
    ks.forEach(k=>{const H=S.hist[k].filter(x=>x.kg>0),f=H[0].kg,l=H[H.length-1].kg,best=Math.max(...H.map(x=>x.kg)),d=l-f;
      const mn=Math.min(...H.map(x=>x.kg)),mx=Math.max(...H.map(x=>x.kg)),W=90,Hh=30;
      const pts=H.map((x,i)=>`${H.length>1?4+i*(W-8)/(H.length-1):W/2},${mx===mn?Hh/2:Hh-4-(x.kg-mn)/(mx-mn)*(Hh-8)}`).join(' ');
      h+=`<div class="pr">${badge(EX[k].m)}<div class="pn"><b>${EX[k].n}</b><small>Recorde ${fkg(best)} kg · 1RM ~${fkg(r05(Math.max(...H.map(x=>e1(x.kg,Math.max(...x.reps))))))} kg</small></div>
        <svg class="spark" viewBox="0 0 ${W} ${Hh}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#c6f135" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <div class="pv"><b>${fkg(l)} kg</b><small class="${d>0?'up':d<0?'dn':''}">${d>0?'+':''}${fkg(d)} kg</small></div></div>`});
    h+=`</div><p class="note">Carga atual de cada exercício e quanto mudou desde o primeiro registro.</p></section>`;
  }
  h+=achPanel()+bodyPanel();
  if(hasEx)h+=`<button class="btn y" id="clearEx">Apagar dados de exemplo</button>`;
  return h;
}

function avatar(){

  return`<span>${esc((p.nome||'A').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`;

function loadPhoto(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const z=240,c=document.createElement('canvas');c.width=c.height=z;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);
    URL.revokeObjectURL(url);S.profile.foto=c.toDataURL('image/jpeg',.82);save();toast('Foto salva!');render()};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Não deu para abrir essa imagem')};
  img.src=url;
}

function go(v){if(v!=='treinos'&&v!=='editor')tGoal=tDays=tEnf=null;if(v!=='editor')ED=null;view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast pow';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.day){const d=+t.dataset.day;S.profile.dias[d]=!S.profile.dias[d];if(!S.profile.dias[d])delete S.profile.assign[d];save();render();return}

  if(t.dataset.tgoal){tGoal=t.dataset.tgoal;render();return}

    if(t.dataset.emv){const i=+t.dataset.emv,j=i+(+t.dataset.d);if(j<0||j>=ED.items.length)return;[ED.items[i],ED.items[j]]=[ED.items[j],ED.items[i]];return re()}

    if(t.dataset.pickg){pickG=t.dataset.pickg;return re()}

  if(t.dataset.bub){const e=curEx(t.dataset.bub),x=exDraft(e),i=+t.dataset.i,tg=e.iso?45:e.cardio?1:x.target;
    const r=x.reps[i];if(r!==null&&!e.cardio&&!e.iso){repsSheet(e,i);return}
    x.reps[i]=r===null?tg:null;save();render();
    if(r===null&&!e.cardio)startRest(GOALS[S.profile.objetivo].rest);
    const nb=document.querySelector(`[data-bub="${e.k}"][data-i="${i}"]`);if(nb&&x.reps[i]===tg)nb.classList.add('pow');return}
  if(t.dataset.all){const e=curEx(t.dataset.all),x=exDraft(e),full=x.reps.every(r=>r!==null);
    x.reps=x.reps.map(()=>full?null:(e.iso?45:x.target));if(full){openDone.delete(e.k);toast('Exercício desmarcado')}save();render();return}
  if(t.dataset.stp){const e=curEx(t.dataset.stp),x=exDraft(e),st=stepOf(e.k);x.kg=Math.max(0,r05((x.kg||0)+st*(+t.dataset.d)));x.touched=true;save();

  if(t.id==='finish'){
    const code=todayCode(),exs=todayExs(code);
    let vol=0,doneSets=0,total=0;const prs=[];
    exs.forEach(ex=>{const x=exDraft(ex);total+=ex.sets;const rs=x.reps.filter(r=>r!==null);doneSets+=rs.length;
      if(!ex.cardio&&rs.length&&(ex.bw||x.kg)){
        const kg=ex.bw?0:x.kg;vol+=rs.reduce((a,r)=>a+r,0)*kg;
        const prev=(S.hist[ex.k]||[]).filter(h=>h.date<iso(today)&&!h.ex&&h.kg>0);
        if(kg>0&&prev.length){const bk=Math.max(...prev.map(h=>h.kg)),be=Math.max(...prev.map(h=>e1(h.kg,Math.max(...h.reps)))),me=e1(kg,Math.max(...rs));
          if(kg>bk)prs.push(`${ex.n}: ${fkg(kg)} kg, sua maior carga`);else if(me>be+0.01)prs.push(`${ex.n}: força máxima estimada ${fkg(r05(me))} kg`)}

/* ---------- Timer de descanso ---------- */
let RT=null,rtIv=null,AC=null;
function beep(){try{if(!AC)return;[0,.22,.44].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1046:784;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.22,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.18);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2)})}catch(e){}}
function startRest(sec){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  RT={end:Date.now()+sec*1000,total:sec,done:false};
  if(!restEl.firstChild)restEl.innerHTML=`<div class="rin"><div class="rbar"></div><span class="rl"></span><b class="rt"></b><button data-rt="-15" aria-label="Menos 15 segundos">−15</button><button data-rt="15" aria-label="Mais 15 segundos">+15</button><button data-rt="x" aria-label="Fechar timer">✕</button></div>`;
  restEl.hidden=false;if(!rtIv)rtIv=setInterval(tickRest,250);tickRest();
}
function stopRest(){RT=null;clearInterval(rtIv);rtIv=null;restEl.hidden=true}
function tickRest(){if(!RT)return;const left=Math.max(0,Math.ceil((RT.end-Date.now())/1000));
  if(left===0&&!RT.done){RT.done=true;try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}beep();setTimeout(()=>{if(RT&&RT.done)stopRest()},7000)}
  const r=restEl.querySelector('.rin');r.classList.toggle('go',RT.done);
  restEl.querySelector('.rbar').style.width=(100*(1-left/RT.total))+'%';
  restEl.querySelector('.rl').textContent=RT.done?'BORA! Próxima série':'Descanso';
  restEl.querySelector('.rt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}

/* ---------- Recuperação muscular ---------- */
function recovery(){const R={},now=Date.now();
  Object.entries(S.hist).forEach(([k,H])=>{const e=EX[k];if(!e)return;H.forEach(h=>{
    const hrs=Math.max(0,(now-new Date(h.date+'T12:00:00').getTime())/36e5);if(hrs>=72)return;
    const w=(1-hrs/72)*h.reps.filter(r=>r>0).length,p=reg(e.m);if(p)R[p]=(R[p]||0)+w;
    (e.s||[]).forEach(m=>{const r=reg(m);if(r&&r!==p)R[r]=(R[r]||0)+w*.5})})});
  return R}
const recState=v=>v>=4?'tired':v>=1.5?'mid':'ok';

  const R=recovery(),col={ok:'#c6f135',mid:'#e0a43a',tired:'#ef6b5d'};
  const by={ok:[],mid:[],tired:[]};Object.keys(REG).forEach(r=>by[recState(R[r]||0)].push(REG[r]));
  return `<section class="panel"><h2>${ic('heart')} Recuperação muscular</h2>

function weekKey(ds){const d=new Date(ds+'T12:00:00');return iso(addDays(d,-((d.getDay()+6)%7)))}
function streak(){const real=S.logs.filter(l=>!l.ex),W=new Set(real.map(l=>weekKey(l.date)));let mon=addDays(today,-((today.getDay()+6)%7)),n=0;
  if(!W.has(iso(mon)))mon=addDays(mon,-7);while(W.has(iso(mon))){n++;mon=addDays(mon,-7)}return n}
function achStats(){const all=S.logs.filter(l=>!l.ex),real=all.filter(isTreino),per={};real.forEach(l=>{const k=weekKey(l.date);per[k]=(per[k]||0)+1});
  const planned=Object.keys(weekPlan()).length;
  return{n:real.length,prs:S.prCount||0,streak:streak(),full:planned>0&&Object.values(per).some(v=>v>=planned),maxVol:Math.max(0,...real.map(l=>l.vol||0)),kcal:all.reduce((a,l)=>a+l.kcal,0)}}

  else if(t.dataset.dract){actSheet();e.stopPropagation()}
  else if(t.dataset.drtour){e.stopPropagation();startTour()}
  else if(t.dataset.drnew){e.stopPropagation();go('treinos');setTimeout(()=>{const b=document.querySelector('#view [data-new]');b&&b.click()},30)}
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawerEl.hidden)closeDrawer()});
/* arrastar para a direita fecha */
let dx0=null;
drawerEl.addEventListener('touchstart',e=>{dx0=e.touches[0].clientX},{passive:true});
drawerEl.addEventListener('touchend',e=>{if(dx0!==null&&e.changedTouches[0].clientX-dx0>70)closeDrawer();dx0=null});

/* ---------- Boas-vindas e tour guiado ---------- */
const TOUR=[
  {v:'inicio',sel:'.hcard',t:'Início',x:'Sua tela inicial: o treino do dia a um toque, o resumo da semana, sua performance, a recuperação dos músculos e a fase do ciclo.'},
  {v:'hoje',sel:'.panel.burst',t:'Treino de hoje',x:'Aqui ficam os exercícios do dia, com a semana do ciclo, os treinos feitos e as calorias.'},
  {v:'hoje',sel:'.ex .load',t:'Carga sugerida',x:'O app já sugere a carga com base no seu último treino. Ajuste com − e + sem precisar digitar.',miss:'Nos dias de treino, cada exercício mostra a carga sugerida com base no último treino.'},
  {v:'hoje',sel:'.ex .setrow',t:'Um toque por série',x:'Terminou a série? Toque na bolinha. Fez outro número de reps? Toque de novo e escolha na lista. "Fiz todas" marca tudo de uma vez. O timer de descanso começa sozinho.',miss:'Nos dias de treino, você marca cada série com um toque e o timer de descanso começa sozinho.'},
  {v:'hoje',sel:'.ex .tools',t:'Ajuda no treino',x:'Veja como fazer o exercício, troque por outro se a máquina estiver ocupada e calcule as anilhas da barra.',miss:'Nos dias de treino, cada exercício tem "Como fazer", "Trocar" e calculadora de anilhas.'},
  {v:'hoje',sel:'#finish',t:'Concluir treino',x:'No fim, toque aqui. O app salva as cargas, calcula as calorias e prepara a progressão do próximo treino.',miss:'No fim do treino, um botão salva tudo e calcula as calorias.'},
  {v:'treinos',sel:'.panel',t:'Meus treinos',x:'Monte um treino do zero ou personalize um pronto: escolha exercícios, séries, ordem e dias.'},
  {v:'treinos',sel:'.goals',t:'Treinos prontos',x:'Escolha o objetivo e quantos dias treina. O app divide por grupos musculares que trabalham juntos.'},
  {v:'semana',sel:'.days',t:'Seus dias',x:'Marque os dias em que pode treinar. A semana se reorganiza sozinha.'},
  {v:'semana',sel:'.phase',t:'Ciclo de 12 semanas',x:'O treino muda de fase a cada semana: adaptação, acúmulo, intensificação e uma semana leve para recuperar.'},
  {v:'evolucao',sel:'.bodywrap',t:'Sua evolução',x:'Veja quais músculos já recuperaram, gráficos, recordes, conquistas, medidas e fotos de progresso.'},
  {v:'perfil',sel:'.photo',t:'Seu perfil',x:'Coloque sua foto, atualize o peso e faça backup dos seus dados. O tour pode ser revisto aqui embaixo. Bom treino!'}
];
let tStep=-1;
const TEl=$('#tour');
function welcome(){
  const p=S.profile;
  TEl.hidden=false;TEl.className='tour-w';
  TEl.innerHTML=`<div class="wcard pow" role="dialog" aria-modal="true" aria-labelledby="wT">
    <div class="logo" style="font-size:44px">SUOR &amp;<small style="font-size:22px">GLÓRIA!</small></div>
    <h2 id="wT" style="margin:10px 0 4px">Bem-vindo!</h2>
    <p style="margin:0 0 10px">Conta um pouco sobre você para o app montar seus treinos.</p>
    <div class="row">
      <div class="field" style="flex-basis:100%"><label for="wNome">Seu nome</label><input id="wNome" value="${esc(p.nome||'')}" placeholder="Como quer ser chamado?"></div>
      <div class="field"><label for="wPeso">Peso (kg)</label><input id="wPeso" inputmode="decimal" value="${fkg(p.peso)}"></div>
      <div class="field"><label for="wIdade">Idade</label><input id="wIdade" inputmode="numeric" value="${p.idade}"></div>
    </div>
    <p class="lbl">Seu objetivo</p>
    <div class="goals">${Object.entries(GOALS).map(([k,g])=>`<button class="goal ${p.objetivo===k?'on':''}" data-wgoal="${k}">${ic(GI[k])}${g.n}</button>`).join('')}</div>
    <button class="btn" id="wGo" style="margin-top:14px">Começar o tour</button>
    <button class="linkb" id="wSkip">Pular o tour</button>
  </div>`;
}
function saveWelcome(){
  const n=$('#wNome').value.trim(),kg=parseFloat($('#wPeso').value.replace(',','.')),id=parseInt($('#wIdade').value);
  if(n)S.profile.nome=n;if(id>0)S.profile.idade=id;
  if(kg>0){S.profile.peso=kg;
    /* desloca o histórico de exemplo para perto do peso informado */
    const exs=S.peso.filter(x=>x.ex);if(exs.length){const d=kg-exs[exs.length-1].kg;exs.forEach(x=>x.kg=Math.round((x.kg+d)*10)/10)}
    S.peso=S.peso.filter(x=>x.date!==iso(today));S.peso.push({date:iso(today),kg})}
  if(!S.logs.some(l=>!l.ex))S.profile.inicio=iso(addDays(today,-((today.getDay()+6)%7)));
  S.onboarded=true;save();render();
}
function showStep(){
  const st=TOUR[tStep];if(!st){endTour();return}
  if(view!==st.v)go(st.v);
  const el=document.querySelector(st.sel);
  TEl.hidden=false;TEl.className='tour-s';
  if(el){el.scrollIntoView({block:'center'});}
  requestAnimationFrame(()=>{
    const r=el?el.getBoundingClientRect():null,pad=8;
    const spot=r?`<div class="spot" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${Math.min(r.height+pad*2,innerHeight*0.6)}px"></div>`:'<div class="spot none"></div>';
    const below=!r||r.top<innerHeight*0.45;
    TEl.innerHTML=spot+`<div class="bubble pow ${below?'b-bot':'b-top'}" role="dialog" aria-live="polite">
      <div class="row" style="justify-content:space-between"><span class="tag p">${tStep+1} de ${TOUR.length}</span><button class="linkb" id="tSkip" style="margin:0">Pular</button></div>
      <h3>${st.t}</h3><p>${el?st.x:(st.miss||st.x)}</p>
      <div class="row" style="justify-content:space-between">${tStep>0?'<button class="btn small y" id="tBack">Voltar</button>':'<span></span>'}
      <button class="btn small" id="tNext">${tStep===TOUR.length-1?'Bora treinar!':'Próximo'}</button></div></div>`;
  });
}
function startTour(){tStep=0;showStep()}
function endTour(){tStep=-1;TEl.hidden=true;TEl.innerHTML='';TEl.className='';S.tourDone=true;save();go('inicio')}
TEl.addEventListener('click',e=>{
  const t=e.target.closest('button');e.stopPropagation();if(!t)return;
  if(t.dataset.wgoal){S.profile.objetivo=t.dataset.wgoal;TEl.querySelectorAll('[data-wgoal]').forEach(b=>b.classList.toggle('on',b===t));return}
  if(t.id==='wGo'){saveWelcome();startTour();return}
  if(t.id==='wSkip'){saveWelcome();endTour();return}
  if(t.id==='tNext'){tStep++;showStep();return}
  if(t.id==='tBack'){tStep--;showStep();return}
  if(t.id==='tSkip'){endTour();return}
});
addEventListener('resize',()=>{if(tStep>=0)showStep()});
document.addEventListener('click',e=>{if(e.target.closest('#tourAgain'))startTour()});

render();
/* correção: quem ainda não treinou começa o ciclo na semana 1 */
if(!S.fixInicio){if(!S.logs.some(l=>!l.ex))S.profile.inicio=iso(addDays(today,-((today.getDay()+6)%7)));S.fixInicio=true;save()}
/* pede ao navegador para não apagar os dados do app */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(!S.onboarded)welcome();
</script>
<script>
/* service worker: funciona offline e avisa quando há versão nova */
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
    setInterval(()=>r.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{}));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had||document.querySelector('.upd'))return;
    const d=document.createElement('div');d.className='upd pow';d.setAttribute('role','status');
    d.innerHTML='<span>Nova versão disponível!</span><button type="button">Atualizar</button>';
    d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d);
  });
}
</script>
</body>
</html>
